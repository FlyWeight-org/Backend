# fly.toml app configuration file generated for flyweight-backend on 2024-09-13T18:14:57-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flyweight-backend'
primary_region = 'sjc'
console_command = '/rails/bin/rails console'

[build]

[env]
  MCP_ENABLED = '1'

[deploy]
  release_command = './bin/rails db:prepare'

[processes]
  app = './bin/rails server'

[http_service]
  internal_port = 3000
  # Stay at one machine: the async Action Cable adapter and the in-memory
  # Rack::Attack counters are per process.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    # Each WebSocket client holds a connection open.
    type = 'connections'
    soft_limit = 200
    hard_limit = 250

[checks]
  [checks.status]
    port = 3000
    type = 'http'
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [checks.status.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[metrics]
  port = 3000
  path = '/metrics'

[[statics]]
  guest_path = '/rails/public'
  url_prefix = '/'
