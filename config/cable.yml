development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: flyweight_development

test:
  adapter: test

cypress:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: flyweight_cypress

production:
  adapter: redis
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: flyweight_production
  # Upstash can take more than redis-client's default second to answer a new
  # connection's handshake, which would drop that broadcast.
  connect_timeout: 5
